[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "image-to-excel-agent"
version = "0.1.0"
description = "Extract structured data from images via OCR and AI, export to Excel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "python-dotenv>=1.0,<2",
    "pillow>=10,<12",
    "paddleocr>=2.7,<3; python_version < '3.13'",
    "google-genai>=1.0,<2",
    "groq>=0.9,<1",
    "openpyxl>=3.1,<4",
    "streamlit>=1.32,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires paddlepaddle and downloads OCR models",
]
